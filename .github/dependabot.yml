# I7：依赖更新自动化（此前全手工）。npm 周更 + actions 周更——
# 安全补丁类更新频率贴合 npm 生态节奏，_major 版本由人工评审。
# 仓库重组后：npm 包清单在 ds_extracted/ds，actions 工作流在根 .github/。
version: 2
updates:
  - package-ecosystem: npm
    directory: /ds_extracted/ds
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TS >=7 生态封锁（2026-09-08 双源实测，PR #7 的处置）：
      # typescript-eslint（含最新 8.70.0）peer 上限 typescript <6.1.0，
      # 且运行时硬守卫「typescript-eslint does not support TS 7.0」；
      # 本仓在 TS 7.0.2 下 typecheck/build 均过、唯 lint 链当场崩。
      # 追踪：typescript-eslint#10940（TS >=7.1 支持）。
      # TS 6.0.x 线在 peer 域内——主动升级时不受此规则影响。
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
