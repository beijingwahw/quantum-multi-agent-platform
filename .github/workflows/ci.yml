name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# I3 硬化四件套：同分支旧跑自动取消（省配额，且旧结果无意义）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# I3 硬化四件套：最小权限（默认 token 只读）
permissions:
  contents: read

# 平台源码自仓库重组后位于 ds_extracted/ds（研究工作区在根目录展开），
# 所有 npm 步骤在该目录执行；本文件是 CI 的唯一活源（ds 子树内不再留副本，防双表漂移）。
defaults:
  run:
    working-directory: ds_extracted/ds

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    # I3 硬化四件套：作业级超时（挂起的测试不应烧 6 小时配额）
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # I1：Node 20 已于 2026-04-30 EOL——支持矩阵不覆盖不收安全补丁的版本
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ds_extracted/ds/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: 构建产物冒烟（I6：绿色 CI ≠ 发布物可用）
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.QuantumMultiAgentPlatform !== 'function' || typeof m.QuantumScheduler !== 'function') { throw new Error('dist smoke failed'); } console.log('dist smoke OK'); })"
      - run: npm test
      - name: Coverage（含 92/82/92/92 防回归门槛）
        run: npm run coverage
      - name: 上传覆盖率报告（I11：失败可查明细）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node-version }}
          path: ds_extracted/ds/coverage/
          retention-days: 7
      - name: 供应链扫描（I3 四件套之四：生产依赖审计）
        run: npm audit --omit=dev --audit-level=high
      - name: Knip（死代码/未用导出门禁）
        run: npm run knip
      - name: 示例冒烟（全链路 basic + advanced）
        # 单元格跑一次即可：basic/advanced 覆盖平台启停/调度/控制台协议
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          npm run example:basic
          npm run example:advanced
        timeout-minutes: 5

  # 04 P1-5：OSV-Scanner 供应链漏洞扫描（与上面 npm audit 互补：OSV 汇聚
  # OSV.dev 多源 Advisory，含 GitHub Advisory/GitLab advisory-db；锁文件自动
  # 检测从仓库根递归发现 ds_extracted/ds/package-lock.json）。
  # 注意：官方仓库根 action.yml 是纯元数据桩（无 runs 段），字面
  # google/osv-scanner-action@v2 会直接失败——用官方 reusable workflow 内部
  # 所引用的同 tag 子路径 action。
  # 引用必须钉具体版本 tag：该仓库不存在 v2 移动标签（tags 仅 v2.x.y 形态），
  # 字面 @v2 解析不到 ref，job 在「Set up job」即红（2026-09-21 三连红实测）。
  # advisory-first：首次引入、误报（仅 dev 依赖/不可达路径）未经 triage 前
  # continue-on-error 观察运行，不阻塞 CI；分诊清零后改为 false 转正门禁
  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: OSV-Scanner（供应链漏洞，advisory 观察位）
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          # 仓库根递归扫描：自动发现 ds_extracted/ds/package-lock.json
          # （uses: 步骤不受本文件 defaults.run.working-directory 影响）
          scan-args: |-
            --recursive
            ./
