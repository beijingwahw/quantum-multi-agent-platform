# 发布供应链（2026-09 基线标配位，审计报告 2.2 主题 5）：
# OIDC trusted publishing + npm provenance——classic token 已于
# 2025-12-09 废弃，发布身份由 GitHub Actions OIDC 断言承载，
# npm 侧需在包设置中关联本仓库（trusted publisher 一次性配置）。
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # provenance 生成需要 id-token（仅发布工作流授予——最小权限原则）
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# 平台包自仓库重组后位于 ds_extracted/ds；本文件是发布链的唯一活源。
defaults:
  run:
    working-directory: ds_extracted/ds

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 发布前的完整验证与 CI 同源：不发布未过门禁的提交
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ds_extracted/ds/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: 构建产物冒烟
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.QuantumMultiAgentPlatform !== 'function') throw new Error('dist smoke failed'); console.log('dist smoke OK'); })"
      - run: npm test
      - name: Coverage 门禁
        run: npm run coverage
      - name: Knip 门禁
        run: npm run knip
      - name: npm ≥ 11.5（OIDC trusted publishing 的最低版本）
        # 2026-11-01 修复互斥配置：本步骤原同时携带 NODE_AUTH_TOKEN —— 有 token
        # 时 token 认证必胜，OIDC 是死配置；token 缺失时发布必败。按本文件
        # 头部声明的基线（classic token 已废弃、身份由 OIDC 断言承载），
        # 移除 token env，使 OIDC 真正生效；trusted publishing 需 npm ≥ 11.5.0
        #（node 22 自带的 npm 10.x 不支持，须显式升级）。
        run: npm install -g npm@^11.5.0
      - name: 发布（OIDC trusted publishing + provenance）
        # --provenance 由 OIDC id-token 签名构建来源链；
        # 公共包默认开启，此处显式声明意图
        run: npm publish --provenance --access public
